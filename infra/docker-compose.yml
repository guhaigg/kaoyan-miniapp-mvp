version: "3.9"

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kaoyan_mvp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - db
      - redis
    environment:
      APP_ENV: dev
      API_PREFIX: /api/v1
      SECRET_KEY: replace-with-strong-secret
      VISITOR_TOKEN_TTL_SECONDS: 604800
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/kaoyan_mvp
      REDIS_URL: redis://redis:6379/0
      USE_MOCK_WECHAT: "true"
      ADMIN_TOKEN: replace-admin-token
      RATE_LIMIT_PER_MINUTE: 120
    ports:
      - "8000:8000"

volumes:
  postgres_data:
