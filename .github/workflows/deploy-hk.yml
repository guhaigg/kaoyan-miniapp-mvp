name: deploy-hk

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: deploy-hk-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required secrets
        env:
          HK_HOST: ${{ secrets.HK_HOST }}
          HK_USER: ${{ secrets.HK_USER }}
          HK_SSH_PRIVATE_KEY: ${{ secrets.HK_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          [ -n "${HK_HOST:-}" ] || { echo "::error::Missing secret HK_HOST"; exit 1; }
          [ -n "${HK_USER:-}" ] || { echo "::error::Missing secret HK_USER"; exit 1; }
          [ -n "${HK_SSH_PRIVATE_KEY:-}" ] || { echo "::error::Missing secret HK_SSH_PRIVATE_KEY"; exit 1; }

      - name: Setup SSH
        env:
          HK_HOST: ${{ secrets.HK_HOST }}
          HK_PORT: ${{ secrets.HK_SSH_PORT }}
          HK_SSH_PRIVATE_KEY: ${{ secrets.HK_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          PORT="${HK_PORT:-22}"
          install -m 700 -d "$HOME/.ssh"
          printf "%s\n" "$HK_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ok=0
          for i in 1 2 3 4 5; do
            if ssh-keyscan -T 10 -4 -p "$PORT" "$HK_HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null; then
              ok=1
              break
            fi
            sleep 2
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::Failed to fetch SSH host key from ${HK_HOST}:${PORT}"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-ui/package-lock.json

      - name: Build web-ui static export
        run: |
          set -euo pipefail
          cd web-ui
          npm ci
          npm run build
          test -f out/index.html
          test -f out/search/index.html
          test -f out/admin/index.html

      - name: Upload web bundle to server
        env:
          HK_HOST: ${{ secrets.HK_HOST }}
          HK_PORT: ${{ secrets.HK_SSH_PORT }}
          HK_USER: ${{ secrets.HK_USER }}
        run: |
          set -euo pipefail
          PORT="${HK_PORT:-22}"
          TARGET="${HK_USER}@${HK_HOST}"
          tar -czf /tmp/gewujl-web-ui.tgz -C web-ui/out .
          scp -P "$PORT" /tmp/gewujl-web-ui.tgz "$TARGET:/tmp/gewujl-web-ui.tgz"

      - name: Upload repo bundle to server
        env:
          HK_HOST: ${{ secrets.HK_HOST }}
          HK_PORT: ${{ secrets.HK_SSH_PORT }}
          HK_USER: ${{ secrets.HK_USER }}
        run: |
          set -euo pipefail
          PORT="${HK_PORT:-22}"
          TARGET="${HK_USER}@${HK_HOST}"
          git bundle create /tmp/kaoyan-miniapp-mvp.bundle main
          scp -P "$PORT" /tmp/kaoyan-miniapp-mvp.bundle "$TARGET:/tmp/kaoyan-miniapp-mvp.bundle"

      - name: Deploy to Hong Kong server
        env:
          HK_HOST: ${{ secrets.HK_HOST }}
          HK_PORT: ${{ secrets.HK_SSH_PORT }}
          HK_USER: ${{ secrets.HK_USER }}
          DEPLOY_PATH: ${{ vars.HK_DEPLOY_PATH }}
          WEB_ROOT: ${{ vars.HK_WEB_ROOT }}
          BACKEND_SERVICE: ${{ vars.HK_BACKEND_SERVICE }}
        run: |
          set -euo pipefail
          PORT="${HK_PORT:-22}"
          TARGET="${HK_USER}@${HK_HOST}"
          DEPLOY_PATH="${DEPLOY_PATH:-/root/code/kaoyan-miniapp-mvp}"
          WEB_ROOT="${WEB_ROOT:-/var/www/html}"
          BACKEND_SERVICE="${BACKEND_SERVICE:-kaoyan-backend}"
          REPO_BUNDLE="${DEPLOY_PATH}.bundle"

          ssh -p "$PORT" "$TARGET" \
            "DEPLOY_PATH='$DEPLOY_PATH' WEB_ROOT='$WEB_ROOT' BACKEND_SERVICE='$BACKEND_SERVICE' REPO_BUNDLE='$REPO_BUNDLE' bash -s" <<'REMOTE'
          set -euo pipefail

          pre_ts="$(date '+%Y%m%d-%H%M%S')"
          pre_dir="/root/backups/predeploy/${pre_ts}"
          mkdir -p "${pre_dir}"
          if [ -d "${DEPLOY_PATH}" ]; then
            tar \
              --exclude='.git' \
              --exclude='backend/.venv' \
              --exclude='**/__pycache__' \
              -czf "${pre_dir}/repo.tar.gz" \
              -C "${DEPLOY_PATH}" \
              .
          fi
          if [ -d "${WEB_ROOT}" ]; then
            tar -czf "${pre_dir}/web.tar.gz" -C "${WEB_ROOT}" .
          fi
          find /root/backups/predeploy -mindepth 1 -maxdepth 1 -type d -mtime +10 -exec rm -rf {} +

          install -d "$(dirname "$REPO_BUNDLE")"
          install -m 600 /tmp/kaoyan-miniapp-mvp.bundle "$REPO_BUNDLE"

          cd "$DEPLOY_PATH"
          git remote set-url origin "$REPO_BUNDLE"
          if [ -n "$(git status --porcelain)" ]; then
            git stash push -u -m "pre-deploy $(date '+%Y-%m-%dT%H:%M:%S')"
          fi
          git fetch origin main
          git checkout main
          git pull --ff-only origin main

          install -d "$WEB_ROOT"
          find "$WEB_ROOT" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          tar -xzf /tmp/gewujl-web-ui.tgz -C "$WEB_ROOT"
          find "$WEB_ROOT" -name '._*' -type f -delete

          install -m 750 infra/backup/gewujl-backup.sh /usr/local/bin/gewujl-backup
          install -m 644 infra/systemd/gewujl-backup.service /etc/systemd/system/gewujl-backup.service
          install -m 644 infra/systemd/gewujl-backup.timer /etc/systemd/system/gewujl-backup.timer
          if [ ! -f /etc/default/gewujl-backup ]; then
            install -m 640 infra/backup/gewujl-backup.env.example /etc/default/gewujl-backup
          fi
          systemctl daemon-reload
          systemctl enable --now gewujl-backup.timer

          if [ -x "backend/.venv/bin/pip" ]; then
            ./backend/.venv/bin/pip install -r backend/requirements.txt
          elif [ -x ".venv/bin/pip" ]; then
            ./.venv/bin/pip install -r backend/requirements.txt
          fi

          if systemctl list-unit-files | grep -q "^${BACKEND_SERVICE}\.service"; then
            systemctl restart "${BACKEND_SERVICE}.service"
            systemctl is-active --quiet "${BACKEND_SERVICE}.service"
          fi

          if systemctl list-unit-files | grep -q "^nginx\.service"; then
            if systemctl is-active --quiet nginx; then
              nginx -t
              systemctl reload nginx
            else
              echo "nginx.service is installed but inactive; skipping reload"
            fi
          fi

          if command -v curl >/dev/null 2>&1; then
            ok=0
            for i in $(seq 1 30); do
              if curl -fsS "http://127.0.0.1:8000/api/v1/health" >/dev/null; then
                ok=1
                break
              fi
              sleep 1
            done
            if [ "$ok" -ne 1 ]; then
              echo "health check failed after retries"
              exit 1
            fi
          fi

          echo "Deploy complete: $(git rev-parse --short HEAD)"
          REMOTE
